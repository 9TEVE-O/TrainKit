[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainkit"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
trainkit = "trainkit.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
